            bottom: 0;

            height: 2px;

        }

            border-color: var(--primary-color);

            border-bottom: 1px solid var(--border-color);

        }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.05;
            z-index: 0;

        function LanguageSwitcher({ currentLanguage, setLanguage }) {
            return (
                <div className="language-switcher">
                    <img
                        src="https://flagicons.lipis.dev/flags/4x3/br.svg"
                        alt="Português"
                        title="Português"
                        className={currentLanguage === 'pt' ? 'active-lang' : ''}
                        onClick={() => setLanguage('pt')}
                    />
                    <img
                        src="https://flagicons.lipis.dev/flags/4x3/us.svg" /* Or gb.svg for UK English */
                        alt="English"
                        title="English"
                        className={currentLanguage === 'en' ? 'active-lang' : ''}
                        onClick={() => setLanguage('en')}
                    />
                </div>
            );
        }

        function Navbar({ activeSection, setActiveSection, currentLangData, currentLanguage, setLanguage }) {
            return (
                <header>
                    <div className="logo">
                        <img src="logo_yellow.png" alt="RaddarTools Logo" />
                        RaddarTools
                    </div>
                    <nav>
                        <ul>
                            {currentLangData.sections.map((section) => (
                                <li key={section.id}>
                                    <a
                                        href={`#${section.id}`}
                                        className={activeSection === section.id ? 'active' : ''}
                                        onClick={(e) => {
                                            e.preventDefault();
                                            document.getElementById(section.id).scrollIntoView({ behavior: 'smooth' });
                                            setActiveSection(section.id);
                                        }}
                                    >
                                        {section.label}
                                    </a>
                                </li>
                            ))}
                        </ul>
                    </nav>
                    <LanguageSwitcher currentLanguage={currentLanguage} setLanguage={setLanguage} />
                </header>
            );
        }

        function Section({ id, children, className = '' }) {
            return (
                <section id={id} className={`animated-gradient ${className}`}>
                    <div className="section-content">
                        {children}
                    </div>
                </section>
            );
        }

        function ExpandableContent({ children, title, buttonTextExpanded, buttonTextCollapsed }) {
            const [isExpanded, setIsExpanded] = useState(false);
            const contentRef = useRef(null);

            const toggleExpand = () => {
                setIsExpanded(!isExpanded);
            };

            return (
                <div>
                    <button className="read-more-button" onClick={toggleExpand}>
                        {isExpanded ? buttonTextExpanded : buttonTextCollapsed}
                    </button>
                    <div ref={contentRef} className={`expandable-content ${isExpanded ? 'expanded' : ''}`}>
                        {children}
                    </div>
                </div>
            );
        }

                }
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                    let currentActive = 'home';
                    for (const section of languageData[currentLanguage].sections) {

                            const rect = element.getBoundingClientRect();
                            if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
                                currentActive = section.id;
                                break;
                            }
                        }
                    }
                    setActiveSection(currentActive);
                };

                window.addEventListener('scroll', handleScroll);

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
